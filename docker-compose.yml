version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexaris-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexaris
    ports:
      - '5432:5432'
    volumes:
      - nexaris-pgdata:/var/lib/postgresql/data

volumes:
  nexaris-pgdata:
